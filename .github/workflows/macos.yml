name: Build wheels

on:
  push:
    branches:
      - macos
    paths-ignore:
      - '.github/workflows/publish.yml'
  pull_request:
    branches:
      - macos

jobs:
  build_wheels:
    name: Build wheel for ${{ matrix.python }}-${{ matrix.buildplat[1] }}
      ${{ matrix.buildplat[2] }} ${{ matrix.buildplat[3] }}
      ${{ matrix.buildplat[4] }}
    runs-on: ${{ matrix.buildplat[0] }}
    strategy:
      fail-fast: false
      matrix:
        buildplat:
        - [ubuntu-22.04, manylinux, x86_64, "", ""]
        #- [ubuntu-22.04, musllinux, x86_64, "", ""]
        #- [ubuntu-24.04-arm, manylinux, aarch64, "", ""]
        #- [ubuntu-24.04-arm, musllinux, aarch64, "", ""]
        #- [macos-15-intel, macosx, x86_64, openblas, "10.14" ]
        #- [macos-15-intel, macosx, x86_64, accelerate, "14.0" ]
        #- [macos-14, macosx, arm64, openblas, "12.3"]
        #- [macos-14, macosx, arm64, accelerate, "14.0"]
        #- [windows-2025, win, AMD64, "", ""]
        #- [windows-11-arm, win, ARM64, "", ""]
        #- [ubuntu-20.04, manylinux, x86_64]
        #- [macos-12, macosx, x86_64]
        #- [macos-14, macosx, arm64]
        #python: ["cp39", "cp312"]
        python: ["cp39"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup macOS
        if: startsWith( matrix.buildplat[0], 'macos-' )
        env:
          TARGET_ARCH: ${{ matrix.buildplat[2] }}
          BLAS_VARIANT: ${{ matrix.buildplat[3] }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.buildplat[4] }}
        run: |
          if [[ "${BLAS_VARIANT}" == "accelerate" ]]; then
            echo CIBW_CONFIG_SETTINGS=\"setup-args=-Dblas=accelerate\" >> "$GITHUB_ENV"

            # Builds with Accelerate only target macOS>=14.0
            CIBW_ENV="CIBW_ENVIRONMENT_MACOS=MACOSX_DEPLOYMENT_TARGET=14.0 INSTALL_OPENBLAS=false"

            if [[ "${TARGET_ARCH}" == "arm64" ]]; then
              # use preinstalled gfortran for Accelerate builds
              ln -s $(which gfortran-13) gfortran
              export PATH=$PWD:$PATH
              echo "PATH=$PATH" >> "$GITHUB_ENV"
              CIBW_ENV+=" INSTALL_GFORTRAN=false"
            else
              # x64_64. Can't use preinstalled fortran because it targets macOS15
              # Setting INSTALL_GFORTRAN=true causes the cibw_before_build script to install gfortran
              CIBW_ENV+=" INSTALL_GFORTRAN=true"
              CIBW_ENV+=" SDKROOT=$(xcrun --sdk macosx --show-sdk-path)"
            fi
          else
            CIBW_ENV="CIBW_ENVIRONMENT_MACOS=PKG_CONFIG_PATH=$PWD/.openblas \
              MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
              SDKROOT=$(xcrun --sdk macosx --show-sdk-path) \
              INSTALL_GFORTRAN=true"
          fi
          #echo "$CIBW_ENV" >> "$GITHUB_ENV"

          PREFIX=DYLD_LIBRARY_PATH="\$(dirname \$(gfortran --print-file-name libgfortran.dylib))"
          CIBW="$PREFIX delocate-wheel -v $EXCLUDE --require-archs {delocate_archs} -w {dest_dir} {wheel}"
          echo "CIBW_REPAIR_WHEEL_COMMAND_MACOS=$CIBW" >> "$GITHUB_ENV"
          ## QEPY build
          CIBW_ENV+=" FFLAGS='-fPIC -fallow-argument-mismatch -ff2c -fno-second-underscore'"
          CIBW_ENV+=" CPP='gcc -E'"
          CIBW_ENV+=" LDFLAGS='-headerpad_max_install_names'"
          CIBW_ENV+=" LIBMBD_C_API=0"
          CIBW_ENV+=" tddft=yes"
          if [[ "${TARGET_ARCH}" == "arm64" ]]; then
            CIBW_ENV+=" CFLAGS='-fPIC -arch arm64'"
            CIBW_ENV+=" QE_INSTALL_FLAGS='--host=host'"
            CIBW_ENV+=" build_alias=arm-apple-darwin20.0.0"
            CIBW_ENV+=" host_alias=x86_64-unknown-linux-gnu"
          fi
          echo "$CIBW_ENV" >> "$GITHUB_ENV"
      - name: Setup Linux
        if: startsWith( matrix.buildplat[0], 'ubuntu-' )
        run: |
          echo "INSTALL_GFORTRAN=false" >> "$GITHUB_ENV"
          CIBW_ENV="CIBW_ENVIRONMENT_LINUX="
          CIBW_ENV+=" FFLAGS='-fPIC -fallow-argument-mismatch'"
          CIBW_ENV+=" LIBMBD_C_API=0"
          CIBW_ENV+=" tddft=yes"
          echo "$CIBW_ENV" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.buildplat[1] }}*
          CIBW_ARCHS: ${{ matrix.buildplat[2] }}

      - uses: actions/upload-artifact@v7.0.0
        with:
          path: ./wheelhouse/*.whl
          name: ${{ matrix.python }}-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}-${{ matrix.buildplat[3] }}-${{ matrix.buildplat[4] }}
